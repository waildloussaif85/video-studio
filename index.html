<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Studio Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. واجهة الغلاف الترحيبية -->
    <div id="splashScreen" class="splash-container">
        <div class="splash-content">
            <div class="splash-logo">🎬</div>
            <h1 class="splash-title">AI Video Studio</h1>
            <p class="splash-subtitle">Create TikToks & Reels in Seconds</p>
            <button class="splash-btn">Start Creating 🚀</button>
        </div>
    </div>

    <div class="bg-blur"></div>

    <!-- 2. الواجهة الأساسية للتطبيق محاطة بالكادر النيون -->
    <div id="appContainer" class="app-container">
        <div class="lang-switcher">
            <button onclick="switchLanguage('en')">EN</button>
            <button onclick="switchLanguage('ar')">العربية</button>
        </div>

        <div class="logo">🎬 <span id="lbl-title">TikTok & Reels Video Maker</span></div>

        <div class="input-section">
            <textarea id="videoText" placeholder="اكتب النص هنا..."></textarea>
        </div>

        <!-- إعدادات التحكم والأزرار والمصغرة -->
        <div class="controls-panel">
            <div class="control-row">
                <div class="control-item">
                    <label id="lbl-size">الحجم:</label>
                    <input type="range" id="fontSize" min="20" max="60" value="40">
                </div>
                <div class="control-item">
                    <label id="lbl-audio">الصوت:</label>
                    <input type="range" id="audioVolume" min="0" max="100" value="50">
                </div>
            </div>

            <div class="control-row colors">
                <div class="color-item">
                    <label id="lbl-font">الخط:</label>
                    <input type="color" id="fontColor" value="#ff0000">
                </div>
                <div class="color-item">
                    <label id="lbl-bg">الخلفية:</label>
                    <input type="color" id="bgColor" value="#000000">
                </div>
                <div class="motion-item">
                    <input type="checkbox" id="motionText" checked>
                    <label id="lbl-motion">نص متحرك</label>
                </div>
            </div>
        </div>

        <!-- أزرار رفع الملفات والميديا -->
        <div class="upload-grid">
            <label for="imageFile" class="mini-upload-btn" id="lbl-imageBtn">📷 Image</label>
            <input type="file" id="imageFile" accept="image/*" style="display: none;">

            <label for="audioFile" class="mini-upload-btn" id="lbl-audioBtn">🎵 Music</label>
            <input type="file" id="audioFile" accept="audio/*" style="display: none;">
        </div>
        
        <div class="file-status" id="fileStatusMessage"></div>

        <button class="generate-btn" id="lbl-btn">Generate Video Now 🔥</button>

        <div id="statusMessage"></div>

        <!-- صندوق المعاينة الواسع وزر الحفظ النهائي -->
        <div id="videoPreviewBox" class="preview-section" style="display: none;">
            <video id="videoPlayer" controls></video>
            <a id="downloadLink" class="download-btn">Save to Phone / حفظ</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
